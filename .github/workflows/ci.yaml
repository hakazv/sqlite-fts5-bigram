name: ci

on:
  push:
  pull_request:

jobs:
  # justfile が手順の定義。手元で `just check` を叩くのと CI が同じものを通るようにして、
  # 両者がずれないようにする。ubuntu だけで呼ぶのは、just を 3 OS 分の runner へ
  # 要求しないため。プラットフォーム差の検証は下の matrix が担う。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v3
      - name: Check
        run: just check

  # C のビルドと中核テストが macOS / Windows でも通ること。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Test static registration
        run: cargo test --test sqlite
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build static and loadable libraries
        run: cmake --build build --config Release
      - name: Install CMake package
        run: cmake --install build --config Release --prefix install
      - name: Configure CMake package consumer
        run: cmake -S tests/cmake-package -B build-package-test -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
      - name: Build CMake package consumer
        run: cmake --build build-package-test --config Release
      - name: Test the C core
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Locate loadable extension
        shell: bash
        run: |
          extension="$(find build -type f \( -name 'fts5_bigram.so' -o -name 'fts5_bigram.dylib' -o -name 'fts5_bigram.dll' \) | head -n 1)"
          test -n "$extension"
          echo "FTS5_BIGRAM_EXTENSION=$extension" >> "$GITHUB_ENV"
      - name: Test loadable extension and derived entry point
        run: cargo test --test loadable
      - name: Test Go adapter
        run: go test ./...
