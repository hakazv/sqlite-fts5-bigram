name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          cmake_version="$(sed -n 's/^project(sqlite_fts5_bigram VERSION \([^ ]*\) LANGUAGES C)$/\1/p' CMakeLists.txt)"
          test -n "$cargo_version"
          test "$cargo_version" = "$cmake_version"
          test "$GITHUB_REF_NAME" = "v$cargo_version"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: fts5_bigram.so
          - os: macos-latest
            library: fts5_bigram.dylib
          - os: windows-latest
            library: fts5_bigram.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure
        shell: bash
        run: |
          arguments=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          if [[ "$RUNNER_OS" == macOS ]]; then
            arguments+=('-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64')
          fi
          cmake "${arguments[@]}"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect loadable extension
        shell: bash
        run: |
          mkdir dist
          library="$(find build -type f -name '${{ matrix.library }}' | head -n 1)"
          test -n "$library"
          cp "$library" "dist/${{ matrix.library }}"
      - name: Verify universal macOS binary
        if: runner.os == 'macOS'
        run: lipo dist/${{ matrix.library }} -verify_arch arm64 x86_64
      - name: Test loadable extension
        env:
          FTS5_BIGRAM_EXTENSION: ${{ github.workspace }}/dist/${{ matrix.library }}
        run: cargo test --test loadable
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: dist/${{ matrix.library }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum fts5_bigram.so fts5_bigram.dylib fts5_bigram.dll > SHA256SUMS
      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/fts5_bigram.so \
            release/fts5_bigram.dylib \
            release/fts5_bigram.dll \
            release/SHA256SUMS \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
